name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  # hl2sdk (cs2 branch) the module was tested with
  HL2SDK_REF: 22087f532ec572d0965c11cdf0f9c245e65ac71b
  # Last Metamod:Source commit with SourceHook (plugin API 17).
  # Utils / Admin System are SourceHook plugins: a module built against
  # Metamod 2.0 with KHook (API 18) would not load next to them.
  MMS_REF: 7ec0f16948ab3a0910a98b4ac10e1c0e360d5339

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 2.31, same as the Steam Runtime (sniper) CS2 servers run in
    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq git ca-certificates clang-10 python3 python3-pip zip
          ln -sf /usr/bin/clang-10 /usr/bin/clang
          ln -sf /usr/bin/clang++-10 /usr/bin/clang++
          python3 -m pip install -q git+https://github.com/alliedmodders/ambuild

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout hl2sdk and Metamod:Source
        run: |
          fetch() {
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "$1" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          mkdir -p external
          fetch https://github.com/alliedmodders/hl2sdk.git external/hl2sdk-cs2 "$HL2SDK_REF"
          fetch https://github.com/alliedmodders/metamod-source.git external/metamod-source "$MMS_REF"

      - name: Build
        run: |
          cd Hide
          mkdir build
          cd build
          CC=clang CXX=clang++ python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize \
            --hl2sdk-manifests=./hl2sdk-manifests \
            --mms_path="$GITHUB_WORKSPACE/external/metamod-source" \
            --hl2sdk-root="$GITHUB_WORKSPACE/external"
          ambuild

      - name: Package
        run: |
          cd Hide/build/package
          zip -r "$GITHUB_WORKSPACE/Hide.zip" addons

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Hide
          path: Hide.zip
