name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'release/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 2.31, same as the Steam Runtime (sniper) CS2 servers run in
    container:
      image: ubuntu:20.04

    steps:
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq git ca-certificates clang-10 python3 python3-pip zip
          ln -sf /usr/bin/clang-10 /usr/bin/clang
          ln -sf /usr/bin/clang++-10 /usr/bin/clang++
          python3 -m pip install -q git+https://github.com/alliedmodders/ambuild

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hide-linux-x86_64
          path: |
            release/hide-linux-x86_64.zip
            release/hide-sourcehook-linux-x86_64.zip
