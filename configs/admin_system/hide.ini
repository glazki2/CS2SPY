"Hide"
{
	// Право (permission) для !hide, !hidelist и пункта в админ-меню. Несколько - через |
	"permission"			"@admin/hide"
	// Админы с этим правом сразу заходят на сервер скрытыми (пусто - выключено).
	// Право нужно выдать явно: @admin/root его не даёт
	"auto_hide_permission"	""

	// Чат-команды через ;. Сообщение с командой в чат не попадает - его никто не видит
	"chat_commands"			"!hide;/hide"
	// Консольные команды через ; (Utils создаёт только команды с префиксом mm_)
	"console_commands"		"mm_hide"
	// Список скрытых админов (только для админов с правом permission)
	"list_chat_commands"	"!hidelist"
	"list_console_commands"	"mm_hidelist"

	// Пункт "Режим невидимки" в админ-меню (1 - да, 0 - нет)
	"menu_item"				"1"
	// Категория админ-меню, в которую добавляется пункт
	"menu_category"			"server"
	// Ключ перевода (admin_system.phrases.txt) или текст названия категории
	"menu_category_name"	"Category_Server"

	// Не отправлять другим игрокам observer-pawn скрытого админа:
	// spec list'ы не видят, за кем он следит (нужен Utils 1.9.1+)
	"hide_pawn"				"1"

	// Не показывать в чате смену команды скрытого админа ("... присоединяется к наблюдателям")
	"silent_team_change"	"1"
	// Не показывать в киллфиде самоубийство при включении невидимки
	"silent_death"			"1"
	// Не показывать сообщение о входе админа, который вернётся скрытым (keep_hidden)
	"silent_connect"		"1"
	// Не показывать сообщение о выходе скрытого админа с сервера
	"silent_disconnect"		"1"

	// Сообщения скрытого админа в чат никто не видит (команды и админ-чат через @ работают)
	"block_chat"			"1"
	// Голос скрытого админа никто не слышит
	"block_voice"			"1"

	// Если скрытого админа перекинули в наблюдатели (AFK-менеджер, баланс и т.п.) - снова скрыть
	"rehide_on_spectator"	"1"
	// Если скрытого админа перекинули в T/CT не по его выбору (mp_force_pick_time, баланс,
	// другой плагин) - снова скрыть. Не больше 3 раз за 30 секунд, потом невидимка выключается
	"rehide_on_team_change"	"1"
	// Не давать серверу автоматически назначить команду скрытому админу (mp_force_pick_time)
	"block_auto_team"		"1"
	// Вернуть невидимку после смены карты / переподключения (до рестарта сервера).
	// Автоматический вход в старую команду после смены карты при этом блокируется
	"keep_hidden"			"1"
	// Включать невидимку, когда админ с доступом сам выбирает "Наблюдатели" в меню команд
	"auto_hide_on_spectate"	"0"

	// На время скрытия меню выбора команды отключается (sv_disable_teamselect_menu 1),
	// после - возвращается это значение. Поставьте 1, если меню на сервере выключено всегда
	"teamselect_menu_restore"	"0"
}
